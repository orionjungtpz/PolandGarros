<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>회의실 사이니지</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── 상태별 CSS 변수 ── */
  :root {
    /* 공실 — 연두/민트 */
    --c-free-bg1:    #e8f5f0;
    --c-free-bg2:    #d0ede4;
    --c-free-accent: #1a9e6e;
    --c-free-text:   #0d5c40;
    --c-free-sub:    #4aaa84;
    --c-free-card:   rgba(255,255,255,0.7);
    --c-free-dot:    #1a9e6e;

    /* 사용 중 — 분홍/로즈 */
    --c-busy-bg1:    #fdf0f2;
    --c-busy-bg2:    #fadddf;
    --c-busy-accent: #c0392b;
    --c-busy-text:   #7a1a20;
    --c-busy-sub:    #c96070;
    --c-busy-card:   rgba(255,255,255,0.7);
    --c-busy-dot:    #e63946;

    /* 예약됨 — 파랑/스카이 */
    --c-next-bg1:    #eef4fd;
    --c-next-bg2:    #d8e9fb;
    --c-next-accent: #1a4fa0;
    --c-next-text:   #0d2d66;
    --c-next-sub:    #4a7cc9;
    --c-next-card:   rgba(255,255,255,0.7);
    --c-next-dot:    #2b7de9;

    /* 현재 상태 (기본: 사용중) */
    --bg1:    var(--c-busy-bg1);
    --bg2:    var(--c-busy-bg2);
    --accent: var(--c-busy-accent);
    --col:    var(--c-busy-text);
    --sub:    var(--c-busy-sub);
    --card:   var(--c-busy-card);
    --dot:    var(--c-busy-dot);
  }

  /* 상태 클래스 */
  body.free   { --bg1:var(--c-free-bg1); --bg2:var(--c-free-bg2); --accent:var(--c-free-accent); --col:var(--c-free-text); --sub:var(--c-free-sub); --card:var(--c-free-card); --dot:var(--c-free-dot); }
  body.upcoming { --bg1:var(--c-next-bg1); --bg2:var(--c-next-bg2); --accent:var(--c-next-accent); --col:var(--c-next-text); --sub:var(--c-next-sub); --card:var(--c-next-card); --dot:var(--c-next-dot); }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:1280px;height:800px;overflow:hidden;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg1);
    transition:background 1s ease;
  }

  /* ── 배경 그라디언트 ── */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 70% at 10% 110%, var(--bg2) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% -10%, var(--bg2) 0%, transparent 55%),
      var(--bg1);
    transition:background 1s ease;
  }
  /* 원형 장식 */
  .bg::before{
    content:'';position:absolute;
    width:500px;height:500px;border-radius:50%;
    right:-100px;bottom:-150px;
    background:radial-gradient(circle, var(--bg2) 0%, transparent 70%);
    opacity:0.8;transition:background 1s;
  }
  .bg::after{
    content:'';position:absolute;
    width:320px;height:320px;border-radius:50%;
    left:-60px;top:-80px;
    background:radial-gradient(circle, var(--bg2) 0%, transparent 70%);
    opacity:0.6;transition:background 1s;
  }

  .root{position:relative;z-index:1;width:1280px;height:800px;display:flex;flex-direction:column;}

  /* ── 헤더 ── */
  .header{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:36px 56px 0;flex-shrink:0;
  }
  .logo-wrap{}
  .logo-posco{
    font-size:16px;font-weight:800;letter-spacing:4px;
    color:var(--accent);text-transform:uppercase;
    transition:color 1s;
  }
  .logo-posco span{font-weight:300;letter-spacing:2px;}
  .logo-sub{font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:1px;transition:color 1s;}

  .clock-wrap{text-align:right;}
  .clock-time{
    font-family:'DM Mono',monospace;
    font-size:64px;font-weight:300;line-height:1;
    letter-spacing:-2px;color:var(--col);
    transition:color 1s;
  }
  .clock-date{font-size:15px;color:var(--sub);margin-top:8px;letter-spacing:0.5px;transition:color 1s;}

  /* ── 중앙 메인 ── */
  .main{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:0 80px;text-align:center;
    gap:0;
  }

  /* 상태 배지 */
  .status-badge{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 20px;border-radius:30px;
    background:rgba(255,255,255,0.5);
    border:1.5px solid var(--accent);
    backdrop-filter:blur(8px);
    margin-bottom:28px;
    transition:border-color 1s;
  }
  .status-dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--dot);
    transition:background 1s;
    flex-shrink:0;
  }
  .status-dot.blink{animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
  .status-text{
    font-size:14px;font-weight:700;letter-spacing:3px;
    text-transform:uppercase;color:var(--accent);
    transition:color 1s;
  }

  /* 회의실명 */
  .room-name{
    font-size:26px;font-weight:500;letter-spacing:4px;
    text-transform:uppercase;color:var(--sub);
    margin-bottom:14px;transition:color 1s;
  }

  /* 회의명 — 메인 타이틀 */
  .meeting-title{
    font-weight:800;
    line-height:1.0;
    color:var(--col);
    margin-bottom:20px;
    transition:color 1s;
    width:100%;
    text-align:center;
    white-space:nowrap;
    font-size:clamp(50px, 8.5vw, 138px);
    letter-spacing:-3px;
  }
  .meeting-title.empty{
    font-weight:300;
    opacity:0.5;
  }

  /* 예약 그룹 */
  .meeting-group{
    font-size:36px;font-weight:500;
    color:var(--sub);letter-spacing:-0.5px;
    margin-bottom:36px;
    transition:color 1s;
  }

  /* 시간 칩 */
  .time-chip{
    display:inline-flex;align-items:center;gap:12px;
    background:var(--card);
    border:1px solid rgba(0,0,0,0.07);
    border-radius:50px;padding:12px 28px;
    backdrop-filter:blur(10px);
    box-shadow:0 2px 20px rgba(0,0,0,0.06);
    transition:background 1s;
  }
  .time-chip-txt{
    font-family:'DM Mono',monospace;
    font-size:30px;font-weight:400;
    color:var(--col);letter-spacing:1px;
    transition:color 1s;
  }
  .time-chip-sep{width:1px;height:18px;background:var(--sub);opacity:0.3;}

  /* 예약자 / 주재 */
  .meeting-people{
    display:flex;flex-direction:column;gap:10px;
    margin-bottom:36px;
    background:var(--card);
    border:1px solid rgba(0,0,0,0.06);
    border-radius:18px;
    padding:18px 36px;
    backdrop-filter:blur(10px);
    min-width:340px;
  }
  .people-row{display:flex;align-items:center;gap:20px;}
  .people-label{
    font-size:13px;font-weight:600;letter-spacing:2px;
    color:var(--sub);text-transform:uppercase;
    min-width:52px;flex-shrink:0;
    transition:color 1s;
  }
  .people-name{
    font-size:20px;font-weight:600;color:var(--col);
    transition:color 1s;
  }

  /* ── 풋터 ── */
  .footer{
    padding:0 56px 32px;
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-shrink:0;
  }
  .floor-info{display:flex;align-items:center;gap:10px;}
  .floor-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);transition:background 1s;}
  .floor-txt{font-size:15px;font-weight:600;letter-spacing:2px;color:var(--sub);text-transform:uppercase;transition:color 1s;}

  .amenities{display:flex;gap:18px;align-items:center;}
  .amenity{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);transition:color 1s;}

  /* ── 상단 컬러 바 ── */
  .top-accent{
    position:fixed;top:0;left:0;right:0;
    height:5px;background:var(--accent);
    transition:background 1s;z-index:10;
  }

  /* ── 진입 애니메이션 ── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .status-badge   {animation:fadeUp 0.6s ease 0.1s both;}
  .room-name      {animation:fadeUp 0.6s ease 0.2s both;}
  .meeting-title  {animation:fadeUp 0.6s ease 0.3s both;}
  .meeting-group  {animation:fadeUp 0.6s ease 0.4s both;}
  .time-chip      {animation:fadeUp 0.6s ease 0.5s both;}
  .header         {animation:fadeUp 0.6s ease 0s   both;}

  /* ── 상태 전환 미리보기 버튼 (데모용) ── */
  .demo-btns{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:50;
    background:rgba(0,0,0,0.15);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:30px;
  }
  .demo-btn{
    padding:5px 14px;border-radius:20px;border:none;
    font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;
    font-family:'Pretendard',sans-serif;transition:all 0.2s;
  }
  .demo-btn:hover{transform:scale(1.05);}
  .demo-btn.d-busy{background:#fadddf;color:#7a1a20;}
  .demo-btn.d-next{background:#d8e9fb;color:#0d2d66;}
  .demo-btn.d-free{background:#d0ede4;color:#0d5c40;}
</style>
</head>
<body class="busy">

<div class="top-accent"></div>
<div class="bg"></div>

<div class="root">

  <!-- 헤더 -->
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-posco">POSCO <span>INTERNATIONAL</span></div>
      <div class="logo-sub">포스코타워-송도</div>
    </div>
    <div class="clock-wrap">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate">-</div>
    </div>
  </div>

  <!-- 중앙 메인 -->
  <div class="main">

    <!-- 상태 배지 + 회의실명 한 줄 -->
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;">
      <div class="status-badge" style="margin-bottom:0;">
        <div class="status-dot blink" id="statusDot"></div>
        <div class="status-text" id="statusText">사용 중</div>
      </div>
      <div style="font-size:15px;font-weight:500;letter-spacing:2px;color:var(--sub);text-transform:uppercase;transition:color 1s;">대회의실 A &nbsp;·&nbsp; 15F</div>
    </div>

    <!-- 회의명 (메인) -->
    <div class="meeting-title" id="meetingTitle">2025 ESG 전략 보고</div>

    <!-- 예약 그룹 -->
    <div class="meeting-group" id="meetingGroup">철강영업팀</div>

    <!-- 예약자 / 주재 -->
    <div class="meeting-people" id="meetingPeople">
      <div class="people-row"><span class="people-label">예약자</span><span class="people-name" id="personBooker">박윤직 사원</span></div>
      <div class="people-row"><span class="people-label">주&nbsp;&nbsp;&nbsp;재</span><span class="people-name" id="personHost">이철수 상무</span></div>
    </div>

    <!-- 시간 -->
    <div class="time-chip">
      <div class="time-chip-txt" id="meetingTime">14:00 – 16:00</div>
      <div class="time-chip-sep"></div>
      <div class="time-chip-txt" id="meetingCount">12명</div>
    </div>

  </div>

  <!-- 풋터 -->
  <div class="footer">
    <div class="floor-info">
      <div class="floor-dot"></div>
      <div class="floor-txt">최대 20인</div>
    </div>
    <div class="amenities">
      <div class="amenity">📺 대형 모니터</div>
      <div class="amenity">🔊 음향</div>
      <div class="amenity">📡 화상회의</div>
      <div class="amenity">🖊️ 화이트보드</div>
    </div>
  </div>

</div>

<!-- 데모용 상태 전환 버튼 -->
<div class="demo-btns">
  <button class="demo-btn d-busy" onclick="setState('busy')">● 사용 중</button>
  <button class="demo-btn d-next" onclick="setState('upcoming')">● 예약됨</button>
  <button class="demo-btn d-free" onclick="setState('free')">● 공실</button>
</div>

<script>
  const states = {
    busy: {
      statusText:'사용 중', blink:true,
      title:'2025 ESG 전략 보고',
      group:'철강영업팀',
      booker:'박윤직 사원', host:'이철수 상무',
      time:'14:00 – 16:00', count:'12명',
    },
    upcoming: {
      statusText:'예약됨', blink:false,
      title:'행정지원그룹 주간보고',
      group:'행정지원그룹',
      booker:'한승호 대리', host:'한석희 차장',
      time:'16:00 – 17:00', count:'8명',
    },
    free: {
      statusText:'공실', blink:false,
      title:'현재 예약 없음',
      group:'다음 예약: 16:00',
      booker:'—', host:'—',
      time:'—', count:'—',
    },
  };

  function setState(s){
    const d = states[s];
    document.body.className = s;

    document.getElementById('statusText').textContent   = d.statusText;
    document.getElementById('meetingTitle').textContent = d.title;
    autoFitTitle(d.title);
    document.getElementById('meetingGroup').textContent = d.group;
    document.getElementById('personBooker').textContent = d.booker;
    document.getElementById('personHost').textContent   = d.host;
    document.getElementById('meetingTime').textContent  = d.time;
    document.getElementById('meetingCount').textContent = d.count;

    const dot = document.getElementById('statusDot');
    dot.classList.toggle('blink', d.blink);

    const titleEl = document.getElementById('meetingTitle');
    titleEl.classList.toggle('empty', s==='free');

    // 공실일 때 예약자/주재 숨기기
    document.getElementById('meetingPeople').style.display = s==='free' ? 'none' : '';
  }

  // ── 글자 수에 따라 폰트 크기 자동 조절 ──
  // 실제 화면 기준 (스케일 0.726 역산): 가용폭 1120px
  function autoFitTitle(text) {
    const el = document.getElementById('meetingTitle');
    const len = text.length;
    // 짧을수록 크게, 기준: 1280px 화면에서 한 줄로
    if      (len <= 6)  el.style.fontSize = '138px';
    else if (len <= 9)  el.style.fontSize = '130px';
    else if (len <= 12) el.style.fontSize = '118px';
    else if (len <= 15) el.style.fontSize = '100px';
    else if (len <= 18) el.style.fontSize = '86px';
    else if (len <= 22) el.style.fontSize = '72px';
    else if (len <= 26) el.style.fontSize = '62px';
    else                el.style.fontSize = '52px';
  }


  function updateClock(){
    const now=new Date(), h=now.getHours(), m=now.getMinutes();
    const days=['일','월','화','수','목','금','토'];
    document.getElementById('clockTime').textContent=pad(h)+':'+pad(m);
    document.getElementById('clockDate').textContent=
      now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+days[now.getDay()]+'요일';
  }
  updateClock();
  setInterval(updateClock, 10000);
  autoFitTitle('2025 ESG 전략 보고');
</script>
</body>
</html>
